<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EinkFrame</title>
    <!-- Inline SVG Favicon (simple picture frame) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Ccircle cx='8.5' cy='8.5' r='1.5'%3E%3C/circle%3E%3Cpolyline points='21 15 16 10 5 21'%3E%3C/polyline%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>EinkFrame</h1>
        <div class="status-indicators">
            <span id="battery-indicator">🔋 --%</span>
            <span id="photo-count">-- / 500</span>
        </div>
    </header>

    <main>
        <!-- Upload Area -->
        <section class="upload-section">
            <div id="drop-zone" class="drop-zone">
                <input type="file" id="file-input" accept="image/*" style="display: none;">
                <div class="drop-content">
                    <svg class="camera-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <p>Tap to select photos or drag &amp; drop</p>
                </div>
            </div>
            
            <div id="upload-progress-container" class="hidden">
                <div class="progress-bar">
                    <div id="upload-progress" class="progress-fill" style="width: 0%"></div>
                </div>
                <p id="upload-status">Uploading...</p>
            </div>
        </section>

        <!-- Gallery Area -->
        <section class="gallery-section">
            <h2>Gallery</h2>
            <div id="empty-gallery-msg" class="hidden">
                <p>No photos exist yet.</p>
            </div>
            <div id="photo-grid" class="photo-grid">
                <!-- Gallery photo items will be dynamically inserted here -->
            </div>
        </section>

        <!-- Settings Panel -->
        <section class="settings-section">
            <details id="settings-panel">
                <summary>Settings</summary>
                <div class="settings-content">
                    <div class="setting-group">
                        <fieldset>
                            <legend>Refresh Interval</legend>
                            <label><input type="radio" name="refresh" value="1h"> 1h</label>
                            <label><input type="radio" name="refresh" value="2h"> 2h</label>
                            <label><input type="radio" name="refresh" value="4h"> 4h</label>
                            <label><input type="radio" name="refresh" value="8h"> 8h</label>
                            <label><input type="radio" name="refresh" value="12h"> 12h</label>
                            <label><input type="radio" name="refresh" value="24h" checked> 24h</label>
                        </fieldset>
                    </div>
                    
                    <div class="setting-group">
                        <fieldset>
                            <legend>Cycling Mode</legend>
                            <label><input type="radio" name="cycling" value="sequential" checked> Sequential</label>
                            <label><input type="radio" name="cycling" value="random"> Random</label>
                        </fieldset>
                    </div>

                    <div class="setting-actions">
                        <button id="exit-btn" class="danger-btn">Exit Upload Mode</button>
                    </div>
                </div>
            </details>
        </section>
    </main>

    <!-- Image Processing Modal -->
    <div id="processing-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Preview &amp; Process</h2>
            <div class="preview-container">
                <div class="preview-pane">
                    <h3>Original</h3>
                    <img id="original-preview" alt="Original Image">
                </div>
                <div class="preview-pane">
                    <h3>E-ink Simulation</h3>
                    <!-- 400x300 e-ink display preview -->
                    <canvas id="dithered-preview" width="400" height="300"></canvas>
                </div>
            </div>
            <div class="modal-actions">
                <button id="cancel-upload-btn" class="btn secondary">Cancel</button>
                <button id="confirm-upload-btn" class="btn primary">Upload</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
