<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EinkFrame</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4a04a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Ccircle cx='8.5' cy='8.5' r='1.5'%3E%3C/circle%3E%3Cpolyline points='21 15 16 10 5 21'%3E%3C/polyline%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-title">EinkFrame</div>
        <div class="header-status">
            <span id="battery-indicator" class="badge">🔋 --%</span>
            <span id="photo-count" class="badge">0 / 180</span>
        </div>
    </header>

    <main class="container">
        <!-- Upload Area -->
        <section>
            <div id="drop-zone" class="upload-zone">
                <input type="file" id="file-input" accept="image/*">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                <p>Tap to select a photo or drag &amp; drop</p>
                <span class="upload-hint">Auto-crops to 400×300 &amp; dithers to 4-color e-ink</span>
            </div>
        </section>

        <!-- Gallery Area -->
        <section>
            <h2>Gallery</h2>
            <div id="gallery-grid" class="gallery">
                <div class="empty-state">Loading photos...</div>
            </div>
        </section>

        <!-- Settings Panel -->
        <section class="settings-panel">
            <details open>
                <summary>Frame Settings</summary>
                <form id="settings-form" class="settings-form">
                    <div class="setting-group">
                        <label class="setting-label">Refresh Interval</label>
                        <div class="pill-group">
                            <label class="pill"><input type="radio" name="refreshHours" value="1"><span>1h</span></label>
                            <label class="pill"><input type="radio" name="refreshHours" value="2"><span>2h</span></label>
                            <label class="pill"><input type="radio" name="refreshHours" value="4" checked><span>4h</span></label>
                            <label class="pill"><input type="radio" name="refreshHours" value="8"><span>8h</span></label>
                            <label class="pill"><input type="radio" name="refreshHours" value="12"><span>12h</span></label>
                            <label class="pill"><input type="radio" name="refreshHours" value="24"><span>24h</span></label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">Cycling Order</label>
                        <div class="pill-group">
                            <label class="pill"><input type="radio" name="cycleMode" value="sequential" checked><span>Sequential</span></label>
                            <label class="pill"><input type="radio" name="cycleMode" value="random"><span>Random</span></label>
                        </div>
                    </div>
                </form>
            </details>
            <button id="btn-exit" type="button" class="btn-danger">Done — Sleep &amp; Show Photos</button>
        </section>
    </main>

    <!-- Image Processing Modal -->
    <div id="upload-modal" class="modal-overlay">
        <div class="modal-card">
            <h2 class="modal-title">Preview E-Ink Photo</h2>
            <div class="preview-container">
                <div class="preview-box">
                    <span class="preview-label">Cropped Original</span>
                    <div id="preview-original"></div>
                </div>
                <div class="preview-box">
                    <span class="preview-label">4-Color E-Ink Dither</span>
                    <div id="preview-dithered"></div>
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-cancel-upload" type="button" class="btn-secondary">Cancel</button>
                <button id="btn-confirm-upload" type="button" class="btn-primary">Confirm &amp; Upload</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
